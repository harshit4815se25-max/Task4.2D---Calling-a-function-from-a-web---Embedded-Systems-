<!DOCTYPE html>
<html>
<head>
  <title>Linda's Smart Home</title>
  <link rel="stylesheet" href="code.css">
</head>

<body>

  <div class="container">
    <h1>Linda's Smart Home</h1>
    <p>Remote Light Control</p>

    <div class="lights">

      <div class="room">
        <span>Living Room</span>
        <input type="checkbox" id="livingroom">
      </div>

      <div class="room">
        <span>Bathroom</span>
        <input type="checkbox" id="bathroom">
      </div>

      <div class="room">
        <span>Closet</span>
        <input type="checkbox" id="closet">
      </div>

    </div>

    <p id="status">Connecting...</p>
  </div>

  <script type="module" src="code.js"></script>

</body>
</html>
